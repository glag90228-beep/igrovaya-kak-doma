<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Трапеза — панель управления</title>
<link rel="stylesheet" href="/app.css">
<style>
  .menu-toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:12px 0 16px; }
  .menu-toolbar input[type=search] { flex:1; min-width:180px; padding:9px 12px; border:1px solid var(--line,#e4d8c7);
    border-radius:9px; font:inherit; }
  .cat-block { border:1px solid var(--line,#e4d8c7); border-radius:12px; padding:12px 14px; margin-bottom:16px;
    background:var(--surface,#fff); }
  .cat-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px; }
  .cat-h-name { font-family:var(--serif,Georgia); font-size:18px; font-weight:700; color:var(--dark,#5e3f27); }
  .cat-h-ctl { display:flex; gap:4px; }
  .btn-xs { padding:3px 8px; font-size:13px; line-height:1.2; border-radius:7px; }
  .menu-grid td { vertical-align:middle; }
  .photo-cell { width:118px; }
  .photo-cell img { width:60px; height:42px; object-fit:cover; border-radius:4px; display:block; }
  .photo-btns { display:flex; gap:4px; margin-top:4px; flex-wrap:wrap; }
  .order-ctl { white-space:nowrap; }
  .desc-input { margin-top:4px; font-size:13px; line-height:1.4; resize:vertical; min-height:44px; }
  .row-dirty { background:#fff7e6 !important; }
  .admin-toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(10px);
    background:var(--dark,#5e3f27); color:#f6efe6; padding:10px 18px; border-radius:10px; font-size:14px;
    opacity:0; transition:opacity .2s, transform .2s; z-index:70; pointer-events:none; }
  .admin-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="header"></div>

<!-- вход -->
<div class="wrap" id="loginBox" hidden>
  <div class="card" style="max-width:380px;margin:60px auto;padding:24px">
    <h2 style="margin-top:0;color:var(--dark)">Вход в панель</h2>
    <div class="field">
      <label for="pw">Пароль</label>
      <input type="password" id="pw" autocomplete="current-password">
    </div>
    <div class="notice" id="loginErr" style="display:none;margin-bottom:12px"></div>
    <button class="btn" id="loginBtn" style="width:100%">Войти</button>
  </div>
</div>

<!-- панель -->
<div class="wrap" id="panel" hidden>
  <div class="tabs">
    <button data-tab="orders" class="on">Заявки</button>
    <button data-tab="menu">Меню и цены</button>
    <button data-tab="settings">Реквизиты</button>
  </div>

  <section id="tab-orders"></section>
  <section id="tab-menu" hidden></section>
  <section id="tab-settings" hidden></section>
</div>

<script src="/app.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let SETTINGS = {};

// ------------------------------------------------- вход

async function boot() {
  const { settings } = await getJSON('/api/bootstrap');
  SETTINGS = settings;
  $('header').innerHTML = brandHeader(settings);
  const { authorized } = await getJSON('/api/login');
  if (authorized) showPanel(); else $('loginBox').hidden = false;
}

$('loginBtn').onclick = async () => {
  try {
    await postJSON('/api/login', { password: $('pw').value });
    $('loginBox').hidden = true;
    showPanel();
  } catch (e) {
    $('loginErr').textContent = e.message;
    $('loginErr').style.display = 'block';
  }
};
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });

function showPanel() {
  $('panel').hidden = false;
  loadOrders();
}

document.querySelectorAll('.tabs button').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
    ['orders', 'menu', 'settings'].forEach((t) => { $('tab-' + t).hidden = (t !== b.dataset.tab); });
    if (b.dataset.tab === 'orders') loadOrders();
    if (b.dataset.tab === 'menu') loadMenu();
    if (b.dataset.tab === 'settings') loadSettings();
  };
});

// ------------------------------------------------- заявки

const STATUSES = ['новая', 'в работе', 'согласована', 'отменена'];

async function loadOrders() {
  const { orders } = await getJSON('/api/admin/orders');
  const el = $('tab-orders');
  if (!orders.length) {
    el.innerHTML = '<p class="notice">Заявок пока нет. Они появятся здесь, как только клиент оформит смету на сайте.</p>';
    return;
  }
  const fresh = orders.filter((o) => o.status === 'новая').length;
  el.innerHTML = `
    <div class="stat">
      <div><div class="lbl">Всего заявок</div><div class="val">${orders.length}</div></div>
      <div><div class="lbl">Новых</div><div class="val">${fresh}</div></div>
    </div>
    ${orders.map(orderCard).join('')}`;
}

function orderCard(o) {
  const rows = o.items.map((it, i) => `
    <tr data-oi="${o.id}">
      <td class="center">${i + 1}</td>
      <td><input value="${esc(it.name)}" data-f="name"></td>
      <td style="width:96px"><input value="${esc(it.unit)}" data-f="unit"></td>
      <td style="width:70px"><input type="number" value="${it.qty}" data-f="qty" min="0"></td>
      <td style="width:92px"><input type="number" value="${it.price}" data-f="price" step="0.01" min="0"></td>
      <td style="width:56px" class="center">
        <input type="checkbox" data-f="price_tbd" ${it.price_tbd ? 'checked' : ''}
               title="цена уточняется" style="width:auto">
      </td>
      <td class="center"><button class="btn btn-ghost btn-sm" data-del-item>✕</button></td>
    </tr>`).join('');

  return `
  <div class="card" style="padding:16px;margin-bottom:14px" data-order="${o.id}">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline">
      <div>
        <b style="font-size:17px">Смета № ${o.number}</b>
        <span class="status-${esc(o.status.replace(/\s/g, '-'))}" style="margin-left:8px">${esc(o.status)}</span>
        <div class="muted" style="font-size:13px">
          ${esc(o.client_name || '—')} · ${esc(o.phone || '—')} ·
          ${esc(dateRu(o.event_date) || 'дата не указана')} · ${o.guests} гост.
        </div>
        <div class="muted" style="font-size:13px">${esc(o.place || '')}</div>
        ${o.comment ? `<div style="font-size:13px;margin-top:4px"><b>Комментарий:</b> ${esc(o.comment)}</div>` : ''}
      </div>
      <div class="right">
        <div style="font-size:20px;font-weight:700;font-family:var(--serif);color:var(--dark)">
          ${rub(o.totals.grandTotal)}
        </div>
        <a class="btn btn-ghost btn-sm" href="/s/${esc(o.code)}" target="_blank">Открыть смету ↗</a>
      </div>
    </div>

    <div class="scroll-x" style="margin-top:12px">
      <table class="grid">
        <thead><tr>
          <th>№</th><th>Наименование</th><th>Выход</th><th>Кол-во</th><th>Цена</th>
          <th title="цена уточняется">Уточн.</th><th></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>

    <div class="grid-2" style="margin-top:12px">
      <div class="field">
        <label>Транспортные расходы, руб.</label>
        <input type="number" value="${o.transport}" data-f="transport" step="0.01" min="0">
      </div>
      <div class="field">
        <label>Статус</label>
        <select data-f="status">
          ${STATUSES.map((s) => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
      </div>
    </div>

    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" data-save>Сохранить</button>
      <button class="btn btn-ghost btn-sm" data-add-item>+ Добавить позицию</button>
      <button class="btn btn-danger btn-sm" data-del-order style="margin-left:auto">Удалить заявку</button>
    </div>
  </div>`;
}

$('tab-orders').addEventListener('click', async (e) => {
  const card = e.target.closest('[data-order]');
  if (!card) return;
  const id = Number(card.dataset.order);

  if (e.target.closest('[data-del-item]')) {
    e.target.closest('tr').remove();
    return;
  }
  if (e.target.closest('[data-add-item]')) {
    const tb = card.querySelector('tbody');
    const n = tb.children.length + 1;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="center">${n}</td>
      <td><input value="" data-f="name" placeholder="Наименование"></td>
      <td><input value="" data-f="unit"></td>
      <td><input type="number" value="1" data-f="qty" min="0"></td>
      <td><input type="number" value="0" data-f="price" step="0.01" min="0"></td>
      <td class="center"><input type="checkbox" data-f="price_tbd" style="width:auto"></td>
      <td class="center"><button class="btn btn-ghost btn-sm" data-del-item>✕</button></td>`;
    tb.appendChild(tr);
    return;
  }
  if (e.target.closest('[data-del-order]')) {
    if (!confirm('Удалить заявку без возможности восстановления?')) return;
    await delJSON('/api/admin/orders/' + id);
    loadOrders();
    return;
  }
  if (e.target.closest('[data-save]')) {
    const items = [...card.querySelectorAll('tbody tr')].map((tr) => ({
      name: tr.querySelector('[data-f="name"]').value,
      unit: tr.querySelector('[data-f="unit"]').value,
      qty: Number(tr.querySelector('[data-f="qty"]').value) || 0,
      price: Number(tr.querySelector('[data-f="price"]').value) || 0,
      price_tbd: tr.querySelector('[data-f="price_tbd"]').checked ? 1 : 0,
    })).filter((i) => i.name.trim());
    const btn = e.target.closest('[data-save]');
    btn.disabled = true; btn.textContent = 'Сохраняем…';
    await putJSON('/api/admin/orders/' + id, {
      items,
      transport: Number(card.querySelector('[data-f="transport"]').value) || 0,
      status: card.querySelector('[data-f="status"]').value,
    });
    loadOrders();
  }
});

// ------------------------------------------------- меню

let MENU_CACHE = [];
let MENU_SEARCH = '';
let ADM_TYPE = 'furshet';           // какое меню редактируем

const TYPES = { furshet: 'Фуршетное меню', banket: 'Банкетное меню' };
const typeOf = (m) => (m.menu_type === 'banket' ? 'banket' : 'furshet');
const catOf = (m) => m.category || 'Без категории';
const inType = (m) => typeOf(m) === ADM_TYPE;

function categoriesInOrder() {
  const cats = [];
  for (const m of MENU_CACHE) if (inType(m) && !cats.includes(catOf(m))) cats.push(catOf(m));
  return cats;
}
function itemsOf(cat) { return MENU_CACHE.filter((m) => inType(m) && catOf(m) === cat); }

function toast(msg) {
  let t = $('adminToast');
  if (!t) { t = document.createElement('div'); t.id = 'adminToast'; t.className = 'admin-toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2000);
}

async function loadMenu() {
  const { menu } = await getJSON('/api/admin/menu');
  MENU_CACHE = menu;
  renderMenuTab();
}

function renderMenuTab() {
  const cats = categoriesInOrder();
  const mine = MENU_CACHE.filter(inType);
  const active = mine.filter((m) => m.active).length;
  $('tab-menu').innerHTML = `
    <div class="menu-switch" id="admSwitch">
      ${Object.entries(TYPES).map(([k, l]) =>
        `<button type="button" data-type="${k}" class="${k === ADM_TYPE ? 'on' : ''}">${l}
         <span class="muted" style="font-weight:400">· ${MENU_CACHE.filter((m) => typeOf(m) === k).length}</span></button>`).join('')}
    </div>
    <div class="stat">
      <div><div class="lbl">Позиций в меню</div><div class="val">${mine.length}</div></div>
      <div><div class="lbl">Показываются</div><div class="val">${active}</div></div>
      <div><div class="lbl">Категорий</div><div class="val">${cats.length}</div></div>
    </div>
    <p class="notice">Меняйте меню как угодно: правки сразу видны клиенту и в смете.
       Заполните <b>состав</b> — клиент увидит его, нажав на блюдо. Порядок — стрелками ↑/↓,
       скрыть позицию — снять галочку «Показ.». После правок нажмите <b>✓</b> в строке.</p>
    <div class="menu-toolbar">
      <input id="menuSearch" type="search" placeholder="Поиск по названию…" value="${esc(MENU_SEARCH)}">
      <button class="btn btn-ghost btn-sm" id="addCat">+ Категория</button>
    </div>
    ${cats.map((c, i) => catBlock(c, i, cats.length)).join('')
      || '<p class="muted">Меню пусто. Нажмите «+ Категория», чтобы начать.</p>'}`;
  $('menuSearch').oninput = (e) => { MENU_SEARCH = e.target.value; applyMenuSearch(); };
  $('admSwitch').onclick = (e) => {
    const b = e.target.closest('button[data-type]');
    if (!b || b.dataset.type === ADM_TYPE) return;
    ADM_TYPE = b.dataset.type;
    renderMenuTab();
  };
  applyMenuSearch();
}

function catBlock(cat, i, count) {
  const items = itemsOf(cat);
  return `
  <div class="cat-block" data-cat="${esc(cat)}">
    <div class="cat-head">
      <div class="cat-h-name">${esc(cat)} <span class="muted" style="font-weight:400">· ${items.length}</span></div>
      <div class="cat-h-ctl">
        <button class="btn btn-ghost btn-xs" data-cat-up title="Категорию выше" ${i === 0 ? 'disabled' : ''}>↑</button>
        <button class="btn btn-ghost btn-xs" data-cat-down title="Категорию ниже" ${i === count - 1 ? 'disabled' : ''}>↓</button>
        <button class="btn btn-ghost btn-xs" data-cat-rename title="Переименовать">✎</button>
      </div>
    </div>
    <div class="scroll-x">
      <table class="grid menu-grid">
        <thead><tr>
          <th style="width:118px">Фото</th><th>Наименование</th><th>Выход</th><th>Цена</th>
          <th title="цена уточняется">Уточн.</th><th>Категория</th><th title="показывать клиенту">Показ.</th>
          <th title="порядок">⇅</th><th></th>
        </tr></thead>
        <tbody>${items.map((m, j) => menuRow(m, j, items.length)).join('')}</tbody>
      </table>
    </div>
    <button class="btn btn-ghost btn-sm" data-add-here style="margin-top:8px">+ Позиция в «${esc(cat)}»</button>
  </div>`;
}

function catSelect(current) {
  const opts = categoriesInOrder()
    .map((c) => `<option ${c === current ? 'selected' : ''}>${esc(c)}</option>`).join('');
  return `<select data-f="category">${opts}<option value="__new__">➕ Новая категория…</option></select>`;
}

function menuRow(m, j, n) {
  const img = m.photo
    ? `<img src="/photos/${encodeURIComponent(m.photo)}" alt="">`
    : '<span class="muted" style="font-size:12px">нет фото</span>';
  return `
  <tr data-menu="${m.id}" data-name="${esc((m.name || '').toLowerCase())}">
    <td class="photo-cell">
      ${img}
      <div class="photo-btns">
        <label class="btn btn-ghost btn-xs">Фото…<input type="file" accept="image/png,image/jpeg,image/webp" data-photo hidden></label>
        ${m.photo ? '<button class="btn btn-ghost btn-xs" data-del-photo>убрать</button>' : ''}
      </div>
    </td>
    <td>
      <input value="${esc(m.name)}" data-f="name" placeholder="Название">
      <textarea data-f="description" rows="2" class="desc-input"
        placeholder="Состав — виден клиенту по клику на блюдо">${esc(m.description || '')}</textarea>
    </td>
    <td style="width:80px"><input value="${esc(m.unit)}" data-f="unit" placeholder="50 гр"></td>
    <td style="width:96px"><input type="number" value="${m.price}" data-f="price" step="0.01" min="0"></td>
    <td class="center"><input type="checkbox" data-f="price_tbd" ${m.price_tbd ? 'checked' : ''} style="width:auto"></td>
    <td style="width:160px">${catSelect(catOf(m))}</td>
    <td class="center"><input type="checkbox" data-f="active" ${m.active ? 'checked' : ''} style="width:auto"></td>
    <td class="order-ctl">
      <button class="btn btn-ghost btn-xs" data-up title="Выше" ${j === 0 ? 'disabled' : ''}>↑</button>
      <button class="btn btn-ghost btn-xs" data-down title="Ниже" ${j === n - 1 ? 'disabled' : ''}>↓</button>
    </td>
    <td class="nowrap">
      <button class="btn btn-sm" data-save-menu title="Сохранить">✓</button>
      <button class="btn btn-ghost btn-sm" data-dup title="Дублировать">⧉</button>
      <button class="btn btn-ghost btn-sm" data-move
        title="Перенести в ${m.menu_type === 'banket' ? 'фуршетное' : 'банкетное'} меню">⇄</button>
      <button class="btn btn-ghost btn-sm" data-del-menu title="Удалить">✕</button>
    </td>
  </tr>`;
}

function applyMenuSearch() {
  const q = MENU_SEARCH.trim().toLowerCase();
  document.querySelectorAll('#tab-menu .cat-block').forEach((block) => {
    let visible = 0;
    block.querySelectorAll('tr[data-menu]').forEach((tr) => {
      const hit = !q || (tr.dataset.name || '').includes(q) || (block.dataset.cat || '').toLowerCase().includes(q);
      tr.style.display = hit ? '' : 'none';
      if (hit) visible += 1;
    });
    block.style.display = (q && visible === 0) ? 'none' : '';
  });
}

/** Полный порядок id: категории по текущему порядку, внутри — как в кэше,
 *  но у категории `overrideCat` берём переданный список. */
function flatOrder(overrideCat, overrideItems) {
  const ids = [];
  for (const c of categoriesInOrder()) {
    const list = (c === overrideCat) ? overrideItems : itemsOf(c);
    ids.push(...list.map((m) => m.id));
  }
  return ids;
}
async function saveOrder(ids) { await postJSON('/api/admin/menu/reorder', { ids }); await loadMenu(); }

async function moveItem(id, dir) {
  const m = MENU_CACHE.find((x) => x.id === id);
  const list = itemsOf(catOf(m));
  const idx = list.findIndex((x) => x.id === id);
  const j = dir === 'up' ? idx - 1 : idx + 1;
  if (j < 0 || j >= list.length) return;
  [list[idx], list[j]] = [list[j], list[idx]];
  await saveOrder(flatOrder(catOf(m), list));
}
async function moveCategory(cat, dir) {
  const cats = categoriesInOrder();
  const idx = cats.indexOf(cat);
  const j = dir === 'up' ? idx - 1 : idx + 1;
  if (j < 0 || j >= cats.length) return;
  [cats[idx], cats[j]] = [cats[j], cats[idx]];
  const ids = [];
  for (const c of cats) ids.push(...itemsOf(c).map((m) => m.id));
  await saveOrder(ids);
}

async function saveRow(tr) {
  const id = tr.dataset.menu;
  const g = (f) => tr.querySelector(`[data-f="${f}"]`);
  let category = g('category').value;
  if (category === '__new__') category = catOf(MENU_CACHE.find((m) => m.id === Number(id)));
  await putJSON('/api/admin/menu/' + id, {
    name: g('name').value, description: g('description').value.trim(),
    unit: g('unit').value,
    price: Number(g('price').value) || 0,
    price_tbd: g('price_tbd').checked ? 1 : 0,
    category, active: g('active').checked ? 1 : 0,
  });
  toast('Сохранено ✓');
  loadMenu();
}

async function uploadPhoto(tr, file) {
  const res = await fetch('/api/admin/photo', {
    method: 'POST', headers: { 'X-Filename': encodeURIComponent(file.name) }, body: file,
  });
  const data = await res.json();
  if (!res.ok) { alert(data.error); return; }
  await putJSON('/api/admin/menu/' + tr.dataset.menu, { photo: data.photo });
  loadMenu();
}

$('tab-menu').addEventListener('change', async (e) => {
  const file = e.target.closest('[data-photo]');
  if (file && file.files[0]) { await uploadPhoto(file.closest('[data-menu]'), file.files[0]); return; }
  const tr = e.target.closest('[data-menu]');
  if (!tr) return;
  const id = tr.dataset.menu;
  if (e.target.matches('select[data-f="category"]')) {
    let val = e.target.value;
    if (val === '__new__') {
      const name = prompt('Название новой категории:');
      if (!name || !name.trim()) { loadMenu(); return; }
      val = name.trim();
    }
    await putJSON('/api/admin/menu/' + id, { category: val });
    loadMenu();
    return;
  }
  if (e.target.matches('input[data-f="active"]')) {
    await putJSON('/api/admin/menu/' + id, { active: e.target.checked ? 1 : 0 });
    loadMenu();
  }
});

$('tab-menu').addEventListener('click', async (e) => {
  if (e.target.closest('#addCat')) {
    const name = prompt('Название новой категории:');
    if (name && name.trim()) {
      await postJSON('/api/admin/menu', { name: 'Новая позиция', category: name.trim(), price: 0, menu_type: ADM_TYPE });
      loadMenu();
    }
    return;
  }
  const block = e.target.closest('[data-cat]');
  if (e.target.closest('[data-cat-up]')) return moveCategory(block.dataset.cat, 'up');
  if (e.target.closest('[data-cat-down]')) return moveCategory(block.dataset.cat, 'down');
  if (e.target.closest('[data-cat-rename]')) {
    const to = prompt('Новое название категории:', block.dataset.cat);
    if (to && to.trim() && to.trim() !== block.dataset.cat) {
      await postJSON('/api/admin/menu/recategorize', { from: block.dataset.cat, to: to.trim() });
      loadMenu();
    }
    return;
  }
  if (e.target.closest('[data-add-here]')) {
    const name = prompt('Название позиции:');
    if (name && name.trim()) {
      await postJSON('/api/admin/menu', { name: name.trim(), category: block.dataset.cat, price: 0, menu_type: ADM_TYPE });
      loadMenu();
    }
    return;
  }
  const tr = e.target.closest('[data-menu]');
  if (!tr) return;
  const id = Number(tr.dataset.menu);
  if (e.target.closest('[data-up]')) return moveItem(id, 'up');
  if (e.target.closest('[data-down]')) return moveItem(id, 'down');
  if (e.target.closest('[data-save-menu]')) return saveRow(tr);
  if (e.target.closest('[data-dup]')) {
    const m = MENU_CACHE.find((x) => x.id === id);
    await postJSON('/api/admin/menu', {
      name: m.name + ' (копия)', description: m.description, unit: m.unit, price: m.price,
      price_tbd: m.price_tbd, category: m.category, menu_type: typeOf(m), photo: m.photo,
    });
    loadMenu();
    return;
  }
  if (e.target.closest('[data-move]')) {
    const m = MENU_CACHE.find((x) => x.id === id);
    const to = typeOf(m) === 'banket' ? 'furshet' : 'banket';
    if (!confirm(`Перенести «${m.name}» в ${TYPES[to].toLowerCase()}?`)) return;
    await putJSON('/api/admin/menu/' + id, { menu_type: to });
    toast('Перенесено в ' + TYPES[to].toLowerCase());
    loadMenu();
    return;
  }
  if (e.target.closest('[data-del-photo]')) { await putJSON('/api/admin/menu/' + id, { photo: '' }); loadMenu(); return; }
  if (e.target.closest('[data-del-menu]')) {
    if (!confirm('Удалить позицию из меню?')) return;
    await delJSON('/api/admin/menu/' + id);
    loadMenu();
  }
});

const FIELDS = [
  ['brand', 'Бренд'], ['org_name', 'Организация'], ['org_short', 'Кратко'],
  ['org_full', 'Полное наименование (для актов)'], ['org_inn', 'ИНН'],
  ['signer', 'Подписант'], ['phone', 'Телефон'], ['phone_digits', 'Телефон цифрами (для WhatsApp/Telegram)'],
  ['slogan', 'Слоган'], ['transport_default', 'Транспортные расходы по умолчанию'],
  ['smeta_note', 'Примечание в смете'], ['admin_password', 'Пароль от панели'],
];

async function loadSettings() {
  const { settings } = await getJSON('/api/admin/settings');
  $('tab-settings').innerHTML = `
    <div class="card" style="padding:18px;max-width:640px">
      ${FIELDS.map(([k, label]) => `
        <div class="field">
          <label>${esc(label)}</label>
          ${k === 'smeta_note'
            ? `<textarea rows="3" data-s="${k}">${esc(settings[k] || '')}</textarea>`
            : `<input data-s="${k}" value="${esc(settings[k] || '')}">`}
        </div>`).join('')}
      <button class="btn" id="saveSettings">Сохранить</button>
      <span class="muted" id="savedMsg" style="margin-left:10px"></span>
    </div>`;
  $('saveSettings').onclick = async () => {
    const body = {};
    document.querySelectorAll('[data-s]').forEach((i) => { body[i.dataset.s] = i.value; });
    await putJSON('/api/admin/settings', body);
    $('savedMsg').textContent = 'Сохранено ✓';
    setTimeout(() => { $('savedMsg').textContent = ''; }, 2500);
  };
}

boot().catch((e) => {
  document.body.innerHTML = `<div class="wrap"><p class="notice">Ошибка: ${esc(e.message)}</p></div>`;
});
