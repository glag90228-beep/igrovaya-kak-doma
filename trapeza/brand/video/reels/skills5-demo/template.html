{ const id = 's1', t = 0; chip(id, 'Claude Code · 5 скиллов', 100);

    tl.fromTo(e, { autoAlpha: 0, scale: .5, y: 60 }, { autoAlpha: 1, scale: 1, y: 0, duration: .55, ease: 'back.out(2.2)', immediateRender: false }, 3.7 + i * .35); tl.to(e, { y: '-=14', duration: 1.2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 4.4 + i * .1); }); }

{ const id = 's2', t = S(id); chip(id, '1 · /simplify'); head(id, ['Убирает повторы'], 240, 66, t + .35);

  const R = ['const fmtDate = (d) => d.toISOString().slice(0, 10)', 'const fmtDay = (d) => d.toISOString().slice(0, 10)', 'const fmtShort = (d) => d.toISOString().slice(0, 10)'].map((x) => mk('div', 'red', { background: 'rgba(255,90,78,.12)', borderRadius: '6px', padding: '2px 10px', overflow: 'hidden', whiteSpace: 'pre' }, '− ' + x, df));
  const G = mk('div', 'grn', { background: 'rgba(61,220,132,.12)', borderRadius: '6px', padding: '2px 10px', whiteSpace: 'pre', opacity: 0 }, '+ // one shared fmtDate helper', df);

{ const id = 's3', t = S(id); chip(id, '2 · /loop'); head(id, ['Повторяет сам'], 240, 66, t + .35);

  const ring = mk('div', '', { position: 'absolute', left: '700px', top: (WIN_Y + 350) + 'px', width: '200px', height: '200px' }, '<svg width="200" height="200" viewBox="0 0 200 200"><circle cx="100" cy="100" r="84" stroke="#3A2F28" stroke-width="14" fill="none"/><circle id="rg" cx="100" cy="100" r="84" stroke="#FF9B73" stroke-width="14" fill="none" stroke-linecap="round" stroke-dasharray="528" stroke-dashoffset="528" transform="rotate(-90 100 100)"/></svg>', SCN[id]);
  tl.fromTo(ring, { autoAlpha: 0, scale: .6 }, { autoAlpha: 1, scale: 1, duration: .5, ease: 'back.out(2)', immediateRender: false }, t + 2.6);
  for (let k = 0; k < 3; k++) tl.fromTo('#rg', { strokeDashoffset: 528 }, { strokeDashoffset: 0, duration: 1.2, ease: 'none', immediateRender: false }, t + 3.0 + k * 1.3);

{ const id = 's5', t = S(id); chip(id, '4 · /run'); head(id, ['Запускает и смотрит'], 240, 62, t + .35);

{ const id = 's8', t = S(id);

  tl.fromTo(b, { autoAlpha: 0, y: 70, scale: .85 }, { autoAlpha: 1, y: 0, scale: 1, duration: .55, ease: 'expo.out', immediateRender: false }, t + 1.5); tl.to(b, { scale: 1.05, duration: BEAT / 2, yoyo: true, repeat: 5, ease: 'sine.inOut' }, t + 2.2); }
// ---------- переходы ----------
D.scenes.forEach((s, i) => { const o = SCN[s.id], t = s.start, prev = i ? SCN[D.scenes[i - 1].id] : null;
  tl.set(o, { autoAlpha: 1 }, t);
  if (prev) {
    if (s.trans === 'zoom') { tl.fromTo(o, { scale: .88, opacity: 0, filter: 'blur(14px)' }, { scale: 1, opacity: 1, filter: 'blur(0px)', duration: .75, ease: 'expo.out', immediateRender: false }, t); tl.to(prev, { scale: 1.18, opacity: 0, filter: 'blur(14px)', duration: .55, ease: 'expo.in' }, t - .05); }
    if (s.trans === 'circle') { tl.fromTo(o, { clipPath: 'circle(0px at 50% 88%)' }, { clipPath: 'circle(1800px at 50% 88%)', duration: .9, ease: 'expo.inOut', immediateRender: false }, t); tl.set(o, { clipPath: 'none' }, t + .95); tl.to(prev, { opacity: 0, duration: .5, ease: 'power2.in' }, t + .3); }
    tl.set(prev, { autoAlpha: 0 }, t + 1.0); }
  tl.fromTo(o, { scale: 1 }, { scale: 1.03, duration: s.end - s.start - .8, ease: 'none', immediateRender: false }, t + .8); });
tl.to(SCN.s8, { opacity: 0, duration: .45, ease: 'power2.inOut' }, T - .45); tl.set('#s1', { autoAlpha: 1 }, T - .45);
// ---------- субтитры ----------
const WORDS = [];
D.vo.forEach(([a, b, txt]) => { const tok = txt.split(' ').map((w) => ({ w: w.replace(/\*/g, ''), key: w.includes('*') })), wts = tok.map((x) => x.w.length + 2), sum = wts.reduce((p, q) => p + q, 0); let acc = a;
  const cap = mk('div', 'cap', null, '', $('#caps'));
  const sp = tok.map((x, i) => { const el = mk('i', '', null, x.w, cap); const t0 = acc, t1 = acc + (b - a) * wts[i] / sum; acc = t1; WORDS.push({ t0, t1, w: x.w, key: x.key }); el._t = t0; el._k = x.key; return el; });
  tl.set(cap, { autoAlpha: 1 }, a); tl.set(cap, { autoAlpha: 0 }, b + .3);
  sp.forEach((el) => tl.set(el, { color: el._k ? '#FF9B73' : '#fff' }, el._t)); });
// ---------- герой: стоит под окном слева и показывает на него; на «Enter» подпрыгивает ----------
const POSE = { 'hero1.png': { W: 876, H: 900 }, 'hero2.png': { W: 751, H: 900, m: { cx: 343, cy: 470, w: 84 } }, 'hero3.png': { W: 753, H: 900 }, 'hero4.png': { W: 620, H: 900 }, 'hero5.png': { W: 1112, H: 900, m: { cx: 554, cy: 780, w: 140 } } };
const hero = $('#hero'), pz = {}, mouths = [];
Object.entries(POSE).forEach(([f, p]) => { const z = mk('div', 'pz', { aspectRatio: p.W + '/' + p.H }, '', hero); const im = mk('img', '', null, '', z); im.src = f; pz[f] = z;
  if (p.m) { const m = mk('i', 'mo', { left: (p.m.cx / p.W * 100) + '%', top: (p.m.cy / p.H * 100) + '%', width: (p.m.w / p.W * 100) + '%', aspectRatio: '2/1' }, '', z); mouths.push(m); } });
tl.set(hero, { yPercent: -100, left: 900, top: 2300, height: 420 }, 0);
const show = (t, f) => Object.entries(pz).forEach(([k, z]) => tl.set(z, { autoAlpha: k === f ? 1 : 0 }, t));
const HX = 210, HY = 1650, HH = 390;
show(2.4, 'hero2.png'); tl.set(hero, { left: HX, top: HY + 800, height: HH }, 2.39); tl.to(hero, { top: HY, duration: 1.0, ease: 'expo.out' }, 2.4);
D.clicks.forEach((c) => { tl.to(hero, { y: -28, duration: .1, ease: 'power2.out' }, c - .1); tl.to(hero, { y: 0, duration: .35, ease: 'bounce.out' }, c); });
// финал: радуется на «Команда в сборе», затем с телефоном — зовёт подписаться
show(S('s7') + 3.4, 'hero3.png'); tl.to(hero, { y: -70, duration: .2, ease: 'power2.out' }, S('s7') + 3.4); tl.to(hero, { y: 0, duration: .4, ease: 'bounce.out' }, S('s7') + 3.6);
show(S('s8') + .6, 'hero1.png'); tl.to(hero, { left: 540, top: 1650, height: 460, duration: .8, ease: 'expo.inOut' }, S('s8') + .6);
tl.to(hero, { top: 2300, duration: .5, ease: 'expo.in' }, T - .8);
for (let k = 0; k < 53; k++) tl.to(hero, { rotation: k % 2 ? -1.2 : 1.2, duration: 1.0, ease: 'sine.inOut' }, k);
const vow = (w) => (w.toLowerCase().match(/[аеёиоуыэюяaeiouy]/g) || []).length || 1;
WORDS.forEach((w) => { const n = vow(w.w), step = Math.max(.1, (w.t1 - w.t0) / n);
  for (let k = 0; k < n; k++) { const t = w.t0 + k * step; mouths.forEach((m) => { tl.to(m, { scaleY: w.key ? 1 : .75, duration: .05, ease: 'power2.out' }, t); tl.to(m, { scaleY: .1, duration: .07, ease: 'power2.in' }, t + Math.min(step * .6, .12)); }); } });
tl.set({}, {}, T);
</script>
