  tl.fromTo(o.cam, { scale: 1 }, { scale: 1.06, duration: s.end - s.start, ease: 'none', immediateRender: false }, t); });
// петля: последний кадр перетекает в первый
tl.to('#s8', { autoAlpha: 0, duration: 0.4 }, T - 0.4); tl.set('#s1', { autoAlpha: 1 }, T - 0.4); tl.fromTo('#s1', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, immediateRender: false }, T - 0.4);
// ---------- голос: субтитры, рот героя ----------
const WORDS = [];
D.vo.forEach(([a, b, txt], li) => { const raw = txt.split(' '), tok = raw.map((w) => ({ w: w.replace(/\*/g, ''), key: w.includes('*') })); const wts = tok.map((x) => x.w.length + 2), sum = wts.reduce((p, q) => p + q, 0); let acc = a;
  const cap = mk('div', 'cap', null, '', $('#caps')); const dk = !['s2', 's4', 's5'].includes(D.scenes.find((s) => a >= s.start && a < s.end).id); if (!dk) cap.classList.add('l');
  const spans = tok.map((x, i) => { const sp = mk('i', '', null, x.w, cap); const t0 = acc, t1 = acc + (b - a) * wts[i] / sum; acc = t1; WORDS.push({ t: t0, key: x.key }); sp._t = t0; sp._key = x.key; return sp; });
  tl.set(cap, { autoAlpha: 1 }, a); tl.set(cap, { autoAlpha: 0 }, b + 0.3);
  spans.forEach((sp) => tl.set(sp, { color: sp._key ? '#43E895' : (dk ? '#fff' : '#0A1230') }, sp._t)); });
// ---------- герой (3D-заглушка: рот двигается по словам) ----------
const ST = makeStage($('#hcv'), { flat: true, dist: 15 }), P = ST.add(), H1 = 4.4 * ST.ppu;
const place = (px, py, h) => Object.assign(ST.at(px, py), { s: h / H1 });
Object.assign(P, place(900, 2100, 440), { rotY: -0.3, rotX: 0.04, rotZ: 0, yaw: 0, spin: 0, armL: 0.35, armR: 0.35, armLx: 0, armRx: 0, handR: 0, eyeS: 1, happy: 0, mouth: 1, jump: 0, sq: 0, look: -0.4, blink: 0, beret: 1, pencil: 1, hood: 0, glasses: 0, laptop: 0, doc: 0, shield: 0, det: 0, mag: 0, guard: 0, flash: 0, beam: 0, bulb: 0, lit: 0 });
const hp = (t, o, d = 0.25, e = 'back.out(2)') => tl.to(P, Object.assign({ duration: d, ease: e }, o), t);
const go = (t, px, py, h, extra = {}, d = 0.4) => { tl.to(P, Object.assign({ duration: d, ease: 'power2.inOut' }, place(px, py, h), extra), t); hp(t, { jump: 0.7 }, d / 2, 'power2.out'); hp(t + d / 2, { jump: 0 }, d / 2, 'power2.in'); };
const hop = (t, h = 0.6) => { hp(t, { sq: 0.12 }, 0.08, 'power2.in'); hp(t + 0.08, { jump: h, sq: -0.06 }, 0.2, 'power2.out'); hp(t + 0.28, { jump: 0, sq: 0 }, 0.3, 'bounce.out'); };
const hs = (id) => D.scenes.find((s) => s.id === id).start;
go(hs('s1') + 3.4, 920, 1850, 440, { rotY: -0.4 });                       // S1: выглядывает на «ноль»
go(hs('s2') + 1.2, 900, 1860, 440); hop(hs('s2') + 1.5, 0.5);             // S2: смотрит на кнопку
go(hs('s3') + 0.2, 180, 1860, 440, { rotY: 0.4, look: 0.5 }); hp(hs('s3') + 0.5, { eyeS: 0.8 });   // S3: расстроен
go(hs('s4') + 0.2, 540, 1880, 470, { rotY: 0 }); hop(hs('s4') + 0.9, 0.9); hp(hs('s4') + 0.9, { happy: 1, armR: 2.5, armL: 2.5 });  // S4: прыжок
const s5 = hs('s5'); go(s5 + 0.2, 880, 1560, 400, { rotY: -0.5, happy: 0 }); [0, 1, 2].forEach((i) => { const t = s5 + 0.3 + i * 3.8; go(t + 1.6, 760, 1160, 330, { armR: 1.8, armRx: -0.5, rotY: -0.7 }, 0.5); hop(t + 2.2, 0.35); go(t + 2.9, 880, 1560, 400, { armR: 0.35, armRx: 0 }, 0.4); });
go(hs('s6') + 0.5, 540, 1850, 560, { rotY: 0, happy: 1 }); hop(hs('s6') + 0.5, 0.8);               // S6: гордый
go(hs('s7') + 1.0, 540, 700, 300, { rotY: -0.2, happy: 1 }); hop(hs('s7') + 1.6, 0.4);            // S7: на крыше машины
go(hs('s8') + 0.3, 540, 1850, 520, { rotY: 0, happy: 1, armR: 2.7, armRx: -0.2 }); for (let k = 0; k < 8; k++) tl.to(P, { handR: k % 2 ? -0.5 : 0.5, duration: 0.2, ease: 'sine.inOut' }, hs('s8') + 0.8 + k * 0.2);
go(T - 0.7, 900, 2100, 440, { happy: 0, armR: 0.35, armRx: 0 }, 0.5);   // петля: герой уходит вниз, как в первом кадре
for (let t = 0, k = 0; t < T - 0.6; t += 1.1, k++) tl.to(P, { yaw: k % 2 ? -0.1 : 0.1, duration: 1.1, ease: 'sine.inOut' }, t);
for (let t = 2.2; t < T - 0.8; t += 2.9) tl.to(P, { blink: 1, duration: 0.06, yoyo: true, repeat: 1 }, t);
WORDS.forEach((w) => { tl.to(P, { mouth: w.key ? 1.9 : 1.55, duration: 0.07 }, w.t); tl.to(P, { mouth: 1, duration: 0.12 }, w.t + 0.1); });
// ---------- подпись сцены и такт ----------
D.scenes.forEach((s, i) => { tl.set('#dbg', { innerHTML: `<b>СЦЕНА ${i + 1} · ${s.name}</b> · переход: ${s.trans}<br>${s.plan}` }, s.start); });
for (let b = 0; b * BEAT < T; b++) tl.fromTo('#beat', { opacity: 1, scale: 1.3 }, { opacity: 0.25, scale: 1, duration: BEAT * 0.8, ease: 'power2.out', immediateRender: false }, b * BEAT);
tl.set({}, {}, T);
</script>
